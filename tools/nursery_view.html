<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PetriHD · Founder nursery</title>
<style>
:root {
  color-scheme: dark;
  --ink: #edf2e8;
  --quiet: #a7b8ae;
  --rim: #344b46;
  --gold: #efbd78;
  --bg: #0d1918;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px "Inter","Segoe UI",sans-serif;
}
main {
  width: min(1480px,100%);
  margin: auto;
  padding: clamp(12px,2.4vw,40px);
}
header,.identity,.actions,.transport,.field {
  display: flex;
  align-items: center;
}
header {
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 19px;
}
.identity {
  gap: 13px;
}
.mark {
  width: 33px;
  height: 33px;
  border: 1.5px solid #b7cbb7;
  border-radius: 50%;
  position: relative;
  transform: rotate(-26deg);
}
.mark:before,.mark:after {
  content: "";
  position: absolute;
  inset: 7px 4px;
  border: 1px solid #b7cbb7;
  border-radius: 50%;
}
.mark:after {
  inset: 11px 9px;
  background: #d1a869;
  border: 0;
}
.brand {
  font: 600 12px "IBM Plex Mono",Consolas,monospace;
  letter-spacing: .13em;
  color: #bfd3c3;
}
.identity h1 {
  font-weight: 500;
  font-size: clamp(17px,2vw,23px);
  margin: 2px 0 0;
  letter-spacing: -.035em;
}
.actions,.transport {
  gap: 9px;
}
button,select {
  border: 1px solid var(--rim);
  border-radius: 5px;
  background: #172724;
  color: var(--ink);
  padding: 8px 12px;
  font: inherit;
  cursor: pointer;
}
button:hover,select:hover {
  background: #213731;
  border-color: #759385;
}
button:focus-visible,select:focus-visible,input:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}
button[aria-pressed=true] {
  border-color: var(--gold);
  color: var(--gold);
}
button:disabled {
  opacity: .55;
  cursor: default;
}
#record {
  background: #e4bb81;
  border-color: #e4bb81;
  color: #15211c;
}
#record.recording {
  background: #853c36;
  color: white;
  border-color: #c97b6d;
}
.stage {
  position: relative;
  background: #113c40;
  border: 1px solid var(--rim);
  border-radius: 5px;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 16/9;
  touch-action: manipulation;
}
.transport {
  padding: 14px 0;
  flex-wrap: wrap;
}
.field {
  gap: 7px;
  color: var(--quiet);
  font-size: 12px;
}
.field select {
  font-size: 13px;
}
#play {
  min-width: 74px;
}
#scrub {
  flex: 1 1 115px;
  min-width: 78px;
  accent-color: #d9ad70;
  cursor: pointer;
}
#time {
  font: 12px "IBM Plex Mono",Consolas,monospace;
  color: #c0cfc4;
  min-width: 84px;
  text-align: center;
}
[hidden] { display: none !important; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
#message {
  min-height: 1em;
  color: var(--quiet);
  font-size: 13px;
  margin: 0;
}
main:fullscreen {
  width: 100%;
  height: 100%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 12px 20px;
}
main:fullscreen .stage {
  align-self: center;
  width: min(100%,calc((100vh - 135px)*16/9));
}
main.clean:fullscreen header,main.clean:fullscreen .transport,main.clean:fullscreen #message {
  display: none;
}
main.clean:fullscreen {
  padding: 0;
  background: black;
}
main.clean:fullscreen .stage {
  width: min(100vw,calc(100vh*16/9));
  border: 0;
  border-radius: 0;
  cursor: none;
}
@media(max-width:700px) {
  header {
    align-items: flex-start;
  }
  .actions {
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 5px;
  }
  .actions button {
    font-size: 12px;
    padding: 6px 8px;
  }
  .identity {
    gap: 7px;
  }
  .mark {
    width: 25px;
    height: 25px;
  }
  .transport {
    gap: 6px;
  }
  .field {
    gap: 3px;
  }
  .transport select,.transport button {
    padding: 6px;
  }
  .brand {
    font-size: 10px;
  }
}
</style>
</head>
<body><main id="player">
<header><div class="identity"><span class="mark" aria-hidden="true"></span><div><div class="brand">PETRIHD</div><h1>Founder nursery</h1></div></div>
<div class="actions"><button id="clean" aria-pressed="false" title="Toggle the film overlay (C)">Clean view</button><button id="full" title="Toggle full screen (F)">Full screen</button><button id="record">Record clip</button></div></header>
<div class="stage"><canvas id="film" width="1280" height="720" aria-label="Replay of real large swimmers and small fish on the nursery lake. Select a fish to inspect it."></canvas></div>
<div class="transport"><button id="play" title="Play or pause (Space)">Pause</button>
<label id="brainField" class="field" hidden>Brain <select id="brain"></select></label>
<label class="field">Trial <select id="chapter"></select></label><button id="ready" hidden>First readiness</button><button id="birth" hidden>First birth</button><button id="adult" hidden>First adult offspring</button><button id="grandchild" hidden>First grandchild</button>
<input id="scrub" aria-label="Simulation tick" type="range" min="0" value="0" step="1">
<output id="time">Tick 0</output>
<label class="field">Speed <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
<label class="field">Camera <select id="lens"><option value="lake">Lake</option><option value="follow">Follow fish</option></select></label></div>
<p id="message" role="status"></p><output id="pondReadout" class="sr-only"></output></main>
<script>

const mono = '"IBM Plex Mono",Consolas,monospace', sans = '"Inter","Segoe UI",sans-serif';

function chapterName(c) {

                        g.quadraticCurveTo(cx + lean * .48 + 1.2, cy - hk * .37, cx, cy);

            }
        }

function lakeCamera(t) {

function updateBed(x, y, width, height) {

function fish(p, focus) {

function label(text, x, y, size = 14, color = "#ecf1e7", font = sans, weight = 500, align = "left") {

function draw() {

            fish(p, p === tracked);

    else if (!state.clean) {

        shadow.addColorStop(0, "rgba(7,27,29,.77)");
        shadow.addColorStop(.28, "rgba(7,27,29,0)");
        shadow.addColorStop(.68, "rgba(7,27,29,0)");
        shadow.addColorStop(1, "rgba(7,27,29,.83)");

        ctx.fillRect(0, 0, W, H);

        let family = "Brain " + take.brain.slice(0, 8);

        if (clip.role === "challenger")

            label(String(value), x, 84, 34, "#f2f2e5", sans, 500, "right");

            label("Energy", 37, H - 52, 15);

}
function playback(now) {
    const dt = clock ? Math.min((now - clock) / 1000, .15) : 0;
    clock = now;
    if (state.playing) {
        state.tick += dt * 42 * Number(el("speed").value);

                state.tick = endTick;
                togglePlay();
                el("play").textContent = "Replay";
                draw();

        }

            draw();

}
function togglePlay() {

}

}

}
function record() {

el("play").onclick = togglePlay;
